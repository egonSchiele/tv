# Refuse crate versions published less than 7 days ago when resolving new
# dependencies (`cargo add`, `cargo update`). Most malicious releases are found
# and pulled within hours, so waiting a week avoids them. Versions already in
# Cargo.lock are unaffected.
#
# Needs Rust 1.100+ (due 2026-11-12). Until rust-toolchain.toml is bumped, cargo
# ignores this with a warning. For an urgent fix, override once with
# CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow cargo update -p <crate>
[registry]
global-min-publish-age = "7 days"
