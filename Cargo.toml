[package]
name = "tv"
version = "0.1.0"
edition = "2024"
description = "A terminal table viewer you share with an agent"
license = "MIT"

# Keep this list short: every crate (and everything it pulls in) is code we
# download and, for build scripts and proc macros, run at compile time. Prefer
# std or a few lines of our own code, and turn off default features we don't use.
# See "Dependencies" in README.md.
[dependencies]
anyhow = "1.0.104"
# Default features minus `color` and `suggestions`, which pull in extra crates.
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
# ratatui re-exports crossterm as `ratatui::crossterm`, so we use that instead of
# depending on crossterm directly. This keeps the two versions in lockstep.
# Only the crossterm backend; the defaults add widgets and macros we don't use.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order` keeps object keys in file order (the spec infers columns in
# first-seen order). It adds one crate, indexmap; its own deps are already here.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"

# Clippy is Rust's linter. Groups get priority -1 so the individual `allow`s
# below override them (otherwise clippy reports a `lint_groups_priority` error).
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight normal code; re-enable individually if wanted.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
