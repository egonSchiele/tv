[package]
name = "tv"
version = "0.1.0"
edition = "2024"
description = "A terminal table viewer you share with an agent"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
rand = "0.10.3"
# ratatui re-exports crossterm as `ratatui::crossterm`, so we use that instead of
# depending on crossterm directly. This keeps the two versions in lockstep.
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.3"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["json"] }
predicates = "3.1.4"
tempfile = "3.27.0"

# Clippy is Rust's linter. Groups get priority -1 so the individual `allow`s
# below override them (otherwise clippy reports a `lint_groups_priority` error).
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight normal code; re-enable individually if wanted.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
